spring.application.name=X_O

spring.datasource.url=jdbc:postgresql://localhost:5432/xo_t05
spring.datasource.username=xo
spring.datasource.password=xo
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.access.secret=${JWT_ACCESS_SECRET:xo-t05-access-secret-key-must-be-at-least-32-bytes}
jwt.refresh.secret=${JWT_REFRESH_SECRET:xo-t05-refresh-secret-key-must-be-at-least-32-bytes}
jwt.access.expiration-ms=900000
jwt.refresh.expiration-ms=2592000000
